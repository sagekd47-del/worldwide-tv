<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account — SavageTech TV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="splash-screen" id="splashScreen">
        <div class="splash-inner">
            <img class="splash-logo" src="assets/logo.png" alt="SavageTech TV">
            <div class="loading-track">
                <div class="loading-bar" id="loadingBar">
                </div>
            </div>
            <div class="loading-copy">
                <span>Preparing your experience</span>
                <span id="loadingPercent">0%</span>
            </div>
        </div>
    </div>
    <div class="auth-card">
        <a class="brand" href="home.html"><img class="brand-logo" src="assets/logo.png" alt="SavageTech TV"></a><span class="section-kicker">JOIN SAVAGETECH</span>
        <h1>Create account</h1>
        <p>Build your own watchlist and profile.</p>
        <form id="signupForm"><label>Username<input id="username" required maxlength="30" placeholder="Choose a username"></label>
            <label>Name<input id="name" placeholder="Your display name"></label>
            <label>Email<input type="email" id="email" required placeholder="you@example.com"></label>
            <label>Password<input type="password" id="password" required minlength="6" placeholder="At least 6 characters"></label>
            <button class="primary-btn full">Create account</button>
        </form>
        <p class="center">Already have an account? 
            <a href="login.html">Sign in</a>
        </p>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
