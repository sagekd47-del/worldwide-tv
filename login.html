<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — SavageTech TV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="splash-screen" id="splashScreen">
        <div class="splash-inner"><img class="splash-logo" src="assets/logo.png" alt="SavageTech TV">
            <div class="loading-track">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-copy">
                <span>Preparing your experience</span>
                <span id="loadingPercent">0%</span>
            </div>
        </div>
    </div>
    <div class="auth-card">
        <a class="brand" href="home.html">
            <img class="brand-logo" src="assets/logo.png" alt="SavageTech TV">
        </a>
        <span class="section-kicker">WELCOME BACK</span>
        <h1>Sign in</h1>
        <p>Continue watching your favorite channels.</p>
        <form id="loginForm">
            <label>Email
                <input type="email" id="email" required placeholder="you@example.com">
            </label>
            <label>Password
                <input type="password" id="password" required placeholder="••••••••">
            </label>
            <button class="primary-btn full">Sign in</button>
        </form>
        <p class="center" style="margin-top:14px"><a href="forgot-password.html">Forgot password?</a></p>
        <div class="divider">or</div>
        <a class="ghost-btn full center" href="signup.html">Create an account</a>
        <small class="demo-note">Local mode: your account stays in this browser. Passwords are stored as secure PBKDF2 hashes; no PostgreSQL is required.</small>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
