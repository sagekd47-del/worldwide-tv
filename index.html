<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06111b"><meta name="description" content="DigiDoctor — Digital Health Solutions">
  <title>DigiDoctor — Loading</title><link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#06111b;color:#e8f7ff;font-family:Arial,sans-serif;min-height:100vh}
    .loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#173c51 0%,#091724 58%,#06111b 100%)}
    .logo{width:min(72vw,350px);max-height:42vh;object-fit:contain;filter:drop-shadow(0 15px 38px #0008)}
    .title{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:1px;margin:18px 0 6px}.sub{color:#9abac9;font-size:13px;margin:0 0 28px}
    .load-wrap{width:min(390px,84vw)}.load-copy{display:flex;justify-content:space-between;font-size:12px;color:#d9edf5;margin-bottom:10px}.load-copy strong{color:#65e3f5}
    .track{height:6px;border-radius:20px;background:#ffffff2b;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#168dd9,#50e3ed);box-shadow:0 0 15px #50dfff;transition:width .15s linear}
    .foot{color:#6e91a4;font-size:10px;letter-spacing:1px;margin-top:13px}
  </style>
</head>
<body><main class="loader" aria-label="DigiDoctor loading screen">
  <img class="logo" src="assets/digidoctor-brand.jpg" alt="DigiDoctor Digital Health Solutions">
  <div class="title">DigiDoctor</div><p class="sub">Every Device Has a Solution.</p>
  <div class="load-wrap"><div class="load-copy"><span id="status">Preparing your experience…</span><strong id="percent">0%</strong></div><div class="track"><div class="bar" id="bar"></div></div><div class="foot">DIGITAL HEALTH SOLUTIONS</div></div>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id), fill=$('bar'), pct=$('percent'), status=$('status');
 const loader=document.querySelector('.load-wrap'); let running=false;
 function showRetry(message){status.textContent=message;let b=$('retry-load');if(!b){b=document.createElement('button');b.id='retry-load';b.type='button';b.style.cssText='margin-top:18px;padding:10px 18px;border:0;border-radius:22px;background:#50e3ed;color:#06111b;font-weight:700;cursor:pointer';loader.appendChild(b);}b.textContent='Retry';b.hidden=false;b.onclick=start;}
 async function start(){if(running)return;running=true;const b=$('retry-load');if(b)b.hidden=true;fill.style.width='0%';pct.textContent='0%';
   const messages=['Starting local diagnostic service…','Checking the local AI engine…','Loading device knowledge…','Preparing multilingual troubleshooting…'];let i=0;status.textContent=messages[0];const timer=setInterval(()=>{i=(i+1)%messages.length;status.textContent=messages[i];},1800);
   try{
     // Local-first: no internet check or remote download is required once Ollama and its model are installed.
     const began=Date.now();let ready=false, last=null;
     while(Date.now()-began<300000){
       try{const r=await fetch('/api/health',{cache:'no-store',signal:AbortSignal.timeout(6000)});last=await r.json();if(r.ok&&last.ok&&last.modelInstalled){ready=true;break;}if(r.ok&&last.ok&&!last.modelInstalled){throw new Error('The configured Ollama model is not installed. Run the model pull command in the setup guide.');}}
       catch(e){if(e.message&&e.message.includes('model is not installed'))throw e;}
       const progress=Math.min(92,Math.floor((Date.now()-began)/300000*92));fill.style.width=progress+'%';pct.textContent=progress+'%';await new Promise(r=>setTimeout(r,2500));
     }
     if(!ready)throw new Error('DigiDoctor Local AI is not ready. Start Node.js and Ollama, then retry.');
     fill.style.width='100%';pct.textContent='100%';status.textContent='Local AI is ready — opening DigiDoctor…';clearInterval(timer);setTimeout(()=>location.replace('home.html'),350);
   }catch(e){clearInterval(timer);fill.style.width='0%';pct.textContent='0%';showRetry(e.message||'Could not start DigiDoctor Local AI.');}
   finally{clearInterval(timer);running=false;}
 }
 start();
})();
</script></body></html>
