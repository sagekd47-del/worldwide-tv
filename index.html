
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SavageTech TV | Launching Tonight</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #03040a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Animated background */
body::before {
  content: "";
  position: fixed;
  inset: -50%;
  background:
    radial-gradient(circle at 30% 40%,
      rgba(0, 180, 255, .20), transparent 35%),
    radial-gradient(circle at 70% 60%,
      rgba(130, 0, 255, .22), transparent 35%);
  animation: atmosphere 10s ease-in-out infinite alternate;
  z-index: -2;
}

@keyframes atmosphere {
  from { transform: scale(1) rotate(0deg); }
  to { transform: scale(1.2) rotate(8deg); }
}

/* Floating particles */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(#ffffff55 1px, transparent 1px);
  background-size: 65px 65px;
  animation: stars 25s linear infinite;
  opacity: .35;
}

@keyframes stars {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

.container {
  width: min(92%, 650px);
  text-align: center;
  padding: 40px 25px;
  border: 1px solid #ffffff18;
  border-radius: 28px;
  background: rgba(10, 13, 25, .72);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 80px #0066ff15;
  animation: appear 1.2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(35px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 25px #00aaff88);
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 10px #0077ff55); }
  to { filter: drop-shadow(0 0 30px #00ccff); }
}

.status {
  display: inline-block;
  padding: 9px 18px;
  border: 1px solid #00d9ff55;
  border-radius: 50px;
  color: #00d9ff;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

.status span {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #00ff9d;
  border-radius: 50%;
  margin-right: 8px;
  box-shadow: 0 0 12px #00ff9d;
}

h1 {
  font-size: clamp(30px, 7vw, 54px);
  line-height: 1.15;
  font-weight: 900;
  margin-bottom: 18px;
}

h1 strong {
  background: linear-gradient(90deg, #00d9ff, #7b61ff, #00d9ff);
  background-size: 200%;
  -webkit-background-clip: text;
  color: transparent;
  animation: gradient 4s linear infinite;
}

@keyframes gradient {
  to { background-position: 200%; }
}

.description {
  color: #a8b0c5;
  line-height: 1.7;
  font-size: 15px;
  max-width: 450px;
  margin: 0 auto 30px;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 30px 0;
}

.time-box {
  width: 85px;
  padding: 17px 5px;
  border: 1px solid #ffffff16;
  background: #ffffff07;
  border-radius: 15px;
}

.time-box b {
  display: block;
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  font-variant-numeric: tabular-nums;
}

.time-box small {
  color: #79849c;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: #8792aa;
  font-size: 11px;
  margin-bottom: 10px;
}

.progress {
  height: 5px;
  background: #ffffff12;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #0077ff, #00eaff);
  box-shadow: 0 0 15px #00aaff;
  transition: width 1s linear;
}

.button {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 30px;
  border: 0;
  border-radius: 50px;
  background: linear-gradient(100deg, #006aff, #00c8ff);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 30px #0077ff35;
  transition: .3s;
}

.button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 0 35px #00aaff88;
}

footer {
  margin-top: 30px;
  color: #586278;
  font-size: 11px;
  letter-spacing: 1px;
}

@media (max-width: 420px) {
  .container { padding: 35px 15px; }
  .time-box { width: 68px; }
  .time-box b { font-size: 25px; }
  .countdown { gap: 7px; }
}
</style>
</head>

<body>

<div class="particles"></div>

<main class="container">

  <!-- Replace logo.png with your actual logo -->
  <img src="logo.png" class="logo" alt="SavageTech TV">

  <div class="status" id="status">
    <span></span> PREPARING FOR LAUNCH
  </div>

  <h1 id="heading">
    The Wait Is<br>
    <strong>Almost Over.</strong>
  </h1>

  <p class="description" id="message">
    Something extraordinary is coming.
    More channels, more entertainment,
    and a completely new streaming experience.
    Get ready to witness the next level.
  </p>

  <div class="countdown" id="countdown">

    <div class="time-box">
      <b id="hours">00</b>
      <small>HOURS</small>
    </div>

    <div class="time-box">
      <b id="minutes">00</b>
      <small>MINUTES</small>
    </div>

    <div class="time-box">
      <b id="seconds">00</b>
      <small>SECONDS</small>
    </div>

  </div>

  <div class="progress-info">
    <span>LAUNCH SEQUENCE</span>
    <span id="percent">0%</span>
  </div>

  <div class="progress">
    <div class="progress-fill" id="progress"></div>
  </div>

  <button class="button" id="readyBtn">
    I'M READY 🚀
  </button>

  <footer>
    SAVAGETECH TV © 2026 · THE FUTURE OF STREAMING
  </footer>

</main>

<script>
// Launch time: 28 November 2026, 10:00 PM Tanzania
// Tanzania is UTC+3, so 22:00 EAT = 19:00 UTC.

const launchTime = new Date("2026-11-28T19:00:00Z").getTime();

// Countdown started at 6:00 PM EAT
const startTime = new Date("2026-11-28T15:00:00Z").getTime();

function updateCountdown() {
  const now = Date.now();
  const remaining = launchTime - now;

  if (remaining <= 0) {
    document.getElementById("status").innerHTML =
      '<span></span> WE ARE LIVE';

    document.getElementById("heading").innerHTML =
      "SavageTech TV<br><strong>Is Now LIVE!</strong>";

    document.getElementById("message").textContent =
      "The wait is over. Welcome to a new streaming experience.";

    document.getElementById("countdown").style.display = "none";
    document.getElementById("progress").style.width = "100%";
    document.getElementById("percent").textContent = "100%";

    document.getElementById("readyBtn").textContent =
      "ENTER SAVAGETECH TV";

    document.getElementById("readyBtn").onclick = () => {
      window.location.href = "home.html";
    };

    return;
  }

  const hours = Math.floor(remaining / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");

  const progress = Math.max(0, Math.min(
    100,
    ((now - startTime) / (launchTime - startTime)) * 100
  ));

  document.getElementById("progress").style.width =
    progress + "%";

  document.getElementById("percent").textContent =
    Math.floor(progress) + "%";
}

document.getElementById("readyBtn").onclick = () => {
  document.getElementById("message").textContent =
    "You're on the list! Stay tuned for the big launch tonight. 🚀";

  document.getElementById("readyBtn").textContent =
    "SEE YOU AT 10 PM ❤️";
};

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
