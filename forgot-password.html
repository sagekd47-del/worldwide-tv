<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — SavageTech TV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="brand" href="home.html"><img class="brand-logo" src="assets/logo.png" alt="SavageTech TV"></a>
  <span class="section-kicker">ACCOUNT RECOVERY</span>
  <h1>Reset password</h1>
  <p>This local version does not send email. Use the recovery code you received when the local account was created.</p>
  <form id="forgotForm">
    <label>Email<input type="email" id="forgotEmail" required placeholder="you@example.com" autocomplete="email"></label>
    <label>Recovery code<input inputmode="numeric" pattern="[0-9]{8}" maxlength="8" id="recoveryCode" required placeholder="8-digit recovery code" autocomplete="one-time-code"></label>
    <label>New password<input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password"></label>
    <button class="primary-btn full" type="submit">Change password</button>
  </form>
  <p id="forgotStatus" class="center" aria-live="polite"></p>
  <p class="center"><a href="login.html">Back to Sign in</a></p>
</div>
<script src="js/auth.js"></script>
</body>
</html>
